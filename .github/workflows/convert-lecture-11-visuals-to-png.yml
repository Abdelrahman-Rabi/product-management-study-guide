name: Convert Lecture 11 visuals to PNG

on:
  push:
    branches:
      - lecture-11-why-product-management-is-broken

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: lecture-11-why-product-management-is-broken
          fetch-depth: 0

      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Convert visuals and update references
        shell: bash
        run: |
          set -euo pipefail
          visual_dir="01-introduction/01-introduction/visuals"

          for svg in "$visual_dir"/11-*.svg; do
            png="${svg%.svg}.png"
            python -m cairosvg "$svg" -o "$png" -s 1
          done

          sed -i 's/\.svg)/.png)/g' \
            01-introduction/01-introduction/11-why-product-management-is-broken.md \
            VISUAL-INDEX.md

          rm "$visual_dir"/11-*.svg
          rm .github/workflows/convert-lecture-11-visuals-to-png.yml

      - name: Commit PNG replacements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace lecture 11 SVG visuals with PNG"
          git push origin HEAD:lecture-11-why-product-management-is-broken
