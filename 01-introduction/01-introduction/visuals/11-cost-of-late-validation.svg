168C86" stroke-width="3"/><text x="595" y="310" text-anchor="middle" class="h">Research</text><rect x="480" y="351" width="230" height="56" rx="14" fill="#FFFFFF" stroke="#168C86" stroke-width="3"/><text x="595" y="388" text-anchor="middle" class="h">Prototype</text><rect x="480" y="429" width="230" height="56" rx="14" fill="#FFFFFF" stroke="#168C86" stroke-width="3"/><text x="595" y="466" text-anchor="middle" class="h">Experiment</text><rect x="480" y="507" width="230" height="56" rx="14" fill="#FFFFFF" stroke="#168C86" stroke-width="3"/><text x="595" y="544" text-anchor="middle" class="h">Evidence</text><rect x="480" y="585" width="230" height="56" rx="14" fill="#FFFFFF" stroke="#168C86" stroke-width="3"/><text x="595" y="622" text-anchor="middle" class="h">Build &amp; Scale</text><text x="205" y="700" text-anchor="middle" class="b">Time • Money • Effort grow first</text><text x="595" y="700" text-anchor="middle" class="b">Learn small, then scale</text><rect x="45" y="865" width="710" height="85" rx="18" fill="#EEF3F7" stroke="#2C6FD6" stroke-width="3"/><text x="70" y="895" text-anchor="start" class="h" fill="#2C6FD6">Key idea:</text><text x="70" y="925" text-anchor="start" class="b">Validate before major investment, not after full delivery.</text><line x1="60" y1="970" x2="740" y2="970" stroke="#CBD5E1"/><text x="400" y="992" text-anchor="middle" class="sm">Product Management Study Guide</text></svg>