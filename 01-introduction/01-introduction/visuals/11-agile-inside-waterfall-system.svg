<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000"><rect width="100%" height="100%" fill="#FAF8F3"/><style>text{font-family:Arial,sans-serif;fill:#102A56}.t{font-weight:700;font-size:40px}.s{font-size:20px}.h{font-weight:700;font-size:22px}.b{font-size:18px}.sm{font-size:15px}</style><text x="400" y="55" text-anchor="middle" class="t">Agile Inside a Waterfall System</text><text x="400" y="90" text-anchor="middle" class="s">Sprints alone do not make the full process Agile</text><rect x="25" y="155" width="85" height="150" rx="14" fill="#FFFFFF" stroke="#2C6FD6" stroke-width="3"/><text x="67.5" y="195" text-anchor="middle" class="h">1</text><text x="67.5" y="270" text-anchor="middle" class="sm">Idea</text><line x1="110" y1="230" x2="122" y2="230" stroke="#102A56" stroke-width="3"/><rect x="122" y="155" width="85" height="150" rx="14" fill="#FFFFFF" stroke="#2C6FD6" stroke-width="3"/><text x="164.5" y="195" text-anchor="middle" class="h">2</text><text x="164.5" y="270" text-anchor="middle" class="sm">Business Case</text><line x1="207" y1="230" x2="219" y2="230" stroke="#102A56" stroke-width="3"/><rect x="219" y="155" width="85" height="150" rx="14" fill="#FFFFFF" stroke="#2C6FD6" stroke-width="3"/><text x="261.5" y="195" text-anchor="middle" class="h">3</text><text x="261.5" y="270" text-anchor="middle" class="sm">Roadmap</text><line x1="304" y1="230" x2="316" y2="230" stroke="#102A56" stroke-width="3"/><rect x="316" y="155" width="85" height="150" rx="14" fill="#FFFFFF" stroke="#2C6FD6" stroke-width="3"/><text x="358.5" y="195" text-anchor="middle" class="h">4</text><text x="358.5" y="270" text-anchor="middle" class="sm">Requirements</text><line x1="401" y1="230" x2="413" y2="230" stroke="#102A56" stroke-width="3"/><rect x="413" y="155" width="85" height="150" rx="14" fill="#FFFFFF" stroke="#2C6FD6" stroke-width="3"/><text x="455.5" y="195" text-anchor="middle" class="h">5</text><text x="455.5" y="270" text-anchor="middle" class="sm">Design</text><line x1="498" y1="230" x2="510" y2="230" stroke="#102A56" stroke-width="3"/><rect x="510" y="155" width="105" height="150" rx="14" fill="#FFFFFF" stroke="#168C86" stroke-width="3"/><text x="562.5" y="195" text-anchor="middle" class="h">6</text><text x="562.5" y="270" text-anchor="middle" class="sm">Development</text><rect x="525" y="205" width="75" height="24" rx="6" fill="#EEF3F7" stroke="#168C86" stroke-width="3"/><text x="562.5" y="222" text-anchor="middle" class="sm">Sprint 1</text><rect x="525" y="235" width="75" height="24" rx="6" fill="#EEF3F7" stroke="#168C86" stroke-width="3"/><text x="562.5" y="252" text-anchor="middle" class="sm">Sprint 2</text><rect x="525" y="265" width="75" height="24" rx="6" fill="#EEF3F7" stroke="#168C86" stroke-width="3"/><text x="562.5" y="282" text-anchor="middle" class="sm">Sprint 3</text><line x1="615" y1="230" x2="627" y2="230" stroke="#102A56" stroke-width="3"/><rect x="627" y="155" width="85" height="150" rx="14" fill="#FFFFFF" stroke="#2C6FD6" stroke-width="3"/><text x="669.5" y="195" text-anchor="middle" class="h">7</text><text x="669.5" y="270" text-anchor="middle" class="sm">Testing</text><line x1="712" y1="230" x2="724" y2="230" stroke="#102A56" stroke-width="3"/><rect x="724" y="155" width="85" height="150" rx="14" fill="#FFFFFF" stroke="#2C6FD6" stroke-width="3"/><text x="766.5" y="195" text-anchor="middle" class="h">8</text><text x="766.5" y="270" text-anchor="middle" class="sm">Release</text><rect x="190" y="360" width="420" height="90" rx="16" fill="#FFF3E8" stroke="#D9772A" stroke-width="3"/><text x="400" y="400" text-anchor="middle" class="h">Most major decisions were made</text><text x="400" y="430" text-anchor="middle" class="b">before the team started sprinting.</text><rect x="70" y="500" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#2C6FD6" stroke-width="3"/><text x="220" y="540" text-anchor="middle" class="h">Sequential planning</text><text x="220" y="585" text-anchor="middle" class="b">Upfront choices are fixed</text><rect x="430" y="500" width="300" height="150" rx="14" fill="#FFFFFF" stroke="#168C86" stroke-width="3"/><text x="580" y="540" text-anchor="middle" class="h">Iterative delivery</text><text x="580" y="585" text-anchor="middle" class="b">Feedback happens in sprints</text><rect x="45" y="865" width="710" height="85" rx="18" fill="#EEF3F7" stroke="#2C6FD6" stroke-width="3"/><text x="70" y="895" text-anchor="start" class="h" fill="#2C6FD6">Key idea:</text><text x="70" y="925" text-anchor="start" class="b">Sprints cannot compensate for waterfall discovery and decisions.</text><line x1="60" y1="970" x2="740" y2="970" stroke="#CBD5E1"/><text x="400" y="992" text-anchor="middle" class="sm">Product Management Study Guide</text></svg>