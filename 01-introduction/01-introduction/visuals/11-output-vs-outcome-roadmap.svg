<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000"><rect width="100%" height="100%" fill="#FAF8F3"/><style>text{font-family:Arial,sans-serif;fill:#102A56}.t{font-weight:700;font-size:40px}.s{font-size:20px}.h{font-weight:700;font-size:22px}.b{font-size:18px}.sm{font-size:15px}</style><text x="400" y="55" text-anchor="middle" class="t">Output Roadmap vs Outcome Roadmap</text><text x="400" y="90" text-anchor="middle" class="s">Features delivered versus results achieved</text><rect x="30" y="130" width="350" height="690" rx="14" fill="#FFFFFF" stroke="#2C6FD6" stroke-width="3"/><rect x="420" y="130" width="350" height="690" rx="14" fill="#FFFFFF" stroke="#168C86" stroke-width="3"/><text x="205" y="170" text-anchor="middle" class="h" fill="#2C6FD6">Output Roadmap</text><text x="595" y="170" text-anchor="middle" class="h" fill="#168C86">Outcome Roadmap</text><rect x="75" y="220" width="260" height="58" rx="14" fill="#FFFFFF" stroke="#2C6FD6" stroke-width="3"/><text x="205" y="257" text-anchor="middle" class="b">Build Dashboard</text><rect x="75" y="305" width="260" height="58" rx="14" fill="#FFFFFF" stroke="#2C6FD6" stroke-width="3"/><text x="205" y="342" text-anchor="middle" class="b">Add Mobile App</text><rect x="75" y="390" width="260" height="58" rx="14" fill="#FFFFFF" stroke="#2C6FD6" stroke-width="3"/><text x="205" y="427" text-anchor="middle" class="b">Launch Integration</text><rect x="75" y="475" width="260" height="58" rx="14" fill="#FFFFFF" stroke="#2C6FD6" stroke-width="3"/><text x="205" y="512" text-anchor="middle" class="b">Create AI Summary</text><rect x="465" y="220" width="260" height="58" rx="14" fill="#FFFFFF" stroke="#168C86" stroke-width="3"/><text x="595" y="257" text-anchor="middle" class="b">Reduce review time</text><rect x="465" y="305" width="260" height="58" rx="14" fill="#FFFFFF" stroke="#168C86" stroke-width="3"/><text x="595" y="342" text-anchor="middle" class="b">Increase activation</text><rect x="465" y="390" width="260" height="58" rx="14" fill="#FFFFFF" stroke="#168C86" stroke-width="3"/><text x="595" y="427" text-anchor="middle" class="b">Improve completion</text><rect x="465" y="475" width="260" height="58" rx="14" fill="#FFFFFF" stroke="#168C86" stroke-width="3"/><text x="595" y="512" text-anchor="middle" class="b">Lower support effort</text><text x="205" y="610" text-anchor="middle" class="h" fill="#D9772A">Commits to solutions</text><text x="205" y="655" text-anchor="middle" class="b">Measures shipped work</text><text x="205" y="700" text-anchor="middle" class="b">Success = delivery</text><text x="595" y="610" text-anchor="middle" class="h" fill="#168C86">Keeps solution options open</text><text x="595" y="655" text-anchor="middle" class="b">Measures customer change</text><text x="595" y="700" text-anchor="middle" class="b">Success = outcome achieved</text><rect x="45" y="865" width="710" height="85" rx="18" fill="#EEF3F7" stroke="#2C6FD6" stroke-width="3"/><text x="70" y="895" text-anchor="start" class="h" fill="#2C6FD6">Key idea:</text><text x="70" y="925" text-anchor="start" class="b">Outcomes define change while leaving room to find the best solution.</text><line x1="60" y1="970" x2="740" y2="970" stroke="#CBD5E1"/><text x="400" y="992" text-anchor="middle" class="sm">Product Management Study Guide</text></svg>